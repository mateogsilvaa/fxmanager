name: Ciclo del juego

# El worker se queda encendido casi 6 horas escuchando Firestore en tiempo real:
# las acciones de los mánagers se procesan en segundos y las sesiones se simulan y publican a su hora.
# Al terminar su turno se relanza solo. El cron es solo un respaldo por si la cadena se corta
# (GitHub retrasa mucho los cron, por eso no se usa para el día a día).
on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      forzar:
        description: 'Ignorar el bloqueo de ciclo en curso'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write   # para relanzarse al acabar el turno

concurrency:
  group: ciclo-juego
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - name: Ciclo inicial
        continue-on-error: true
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: node worker/run.mjs ${{ inputs.forzar && '--forzar' || '' }}
      - name: Worker continuo (5 h 40 min)
        env:
          BOT_EMAIL: ${{ secrets.BOT_EMAIL }}
          BOT_PASSWORD: ${{ secrets.BOT_PASSWORD }}
        run: node worker/run.mjs --continuo 340
      - name: Relanzar el siguiente turno
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ciclo.yml --ref ${{ github.ref_name }}
